services:
  php:
    image: laravelsail/php84-composer
    volumes:
      - './:/app'
    working_dir: /app
    user: '1000:1000'
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
    ports:
      - '7000:8000'
    command: php -S 0.0.0.0:8000 -t /app
